name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typetjek
        run: npm run typecheck
      - name: Enhedstests og stavetjek
        run: npm test
      - name: Korrekturliste
        run: npm run korrektur
      - name: Installér Chromium til browsertest
        run: npx playwright install --with-deps chromium
      - name: Gennemspil kapitel 1 i Chrome
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Gem skærmbilleder og korrekturliste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skaermbilleder-og-korrektur
          path: |
            test-results/
            korrektur/korrekturliste.md
          retention-days: 14

  # Når main er grøn, lægges spillet på GitHub Pages, så Henrik altid kan teste den nyeste udgave på ét fast link:
  # https://htheland-chao.github.io/Pennedal/  (Henrik godkendte et offentligt testlink 31. oktober 2026)
  # Kræver én gang: Settings > Pages > Source: GitHub Actions.
  udgiv:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.udgiv.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Byg spillet
        run: npx vite build --sourcemap false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: udgiv
        uses: actions/deploy-pages@v4
