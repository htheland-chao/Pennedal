name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typetjek
        run: npm run typecheck
      - name: Enhedstests og stavetjek
        run: npm test
      - name: Korrekturliste
        run: npm run korrektur
      - name: Installér Chromium til browsertest
        run: npx playwright install --with-deps chromium
      - name: Gennemspil kapitel 1 i Chrome
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Gem skærmbilleder og korrekturliste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skaermbilleder-og-korrektur
          path: |
            test-results/
            korrektur/korrekturliste.md
          retention-days: 14
