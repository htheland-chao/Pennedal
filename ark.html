<!doctype html>
<!-- Grafikark til udvikling (npm run grafik:ark). Kun til Vite-udviklingsserveren, kommer ikke med i spillet. -->
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <title>Pennedal - grafikark</title>
    <style>
      body { margin: 0; padding: 16px; background: #2b2b33; color: #eee; font: 13px/1.3 system-ui, sans-serif; }
      h2 { margin: 0 0 8px; font-size: 15px; }
      section { margin-bottom: 20px; padding: 12px; background: #34343e; display: inline-block; max-width: 1300px; }
      .gitter { display: flex; flex-wrap: wrap; gap: 10px; }
      figure { margin: 0; text-align: center; }
      canvas { display: block; margin: 0 auto 4px; image-rendering: pixelated; background: repeating-conic-gradient(#4a4a55 0 25%, #3d3d47 0 50%) 0 0 / 8px 8px; }
      figcaption { font-size: 11px; color: #bbb; max-width: 120px; }
      .advarsel { color: #ffb86b; }
    </style>
  </head>
  <body>
    <div id="ark"></div>
    <script type="module" src="/src/ark/ark.ts"></script>
  </body>
</html>
